play_buttons_help : "<blockquote><b>✦ 𝐁‌σᴛ 𝐏‌ℓαʏ 𝐁‌υᴛᴛση 𝐃‌єᴛαɪℓѕ :\n𝐌‌αηαɢє 𝐘‌συʀ 𝐌‌υѕɪᴄ 𝐏‌ℓαʏʙαᴄκ 𝐃‌ɪʀєᴄᴛℓʏ 𝐓‌ʜʀσυɢʜ 𝐈‌ηℓɪηє 𝐁‌υᴛᴛσηѕ 𝐖‌ɪᴛʜ 𝐄‌αѕє.\n\n✦ 𝐏‌ℓαʏʙαᴄκ 𝐂‌σηᴛʀσℓѕ :\n\n⇢ ▷ : 𝐑‌єѕυᴍє Ꭲʜє 𝐏‌αυѕєᴅ 𝐒‌ᴛʀєαᴍ.\n⇢ Ⅱ : 𝐏‌αυѕє Ꭲʜє 𝐂‌υʀʀєηᴛ 𝐒‌ᴛʀєαᴍ.\n⇢ ↻ : 𝐑‌єᴘℓαʏ Ꭲʜє 𝐂‌υʀʀєηᴛ 𝐒‌σηɢ 𝐅‌ʀσᴍ 𝐓‌ʜє 𝐁‌єɢɪηηɪηɢ.\n⇢ ‣‣Ⅰ : 𝐒‌κɪᴘ Ꭲʜє 𝐂‌υʀʀєηᴛ 𝐓‌ʀαᴄκ Ληᴅ 𝐏‌ℓαʏ 𝐍‌єχᴛ.\n⇢ ▢ : 𝐒‌ᴛσᴘ 𝐏‌ℓαʏʙαᴄκ Ληᴅ 𝐂‌ℓєαʀ Ꭲʜє 𝐐‌υєυє.\n\n✦ 𝐒‌єєκ & 𝐌‌σʀє 𝐂‌σηᴛʀσℓѕ :\n\n⇢ -𝟷𝟻ˢ : 𝐒‌єєκ 𝐁‌αᴄκωαʀᴅ 𝐁‌ʏ 𝟷𝟻 𝐒‌єᴄσηᴅѕ.\n⇢ 𝟷𝟻ˢ+ : 𝐒‌єєκ 𝐅‌σʀωαʀᴅ 𝐁‌ʏ 𝟷𝟻 𝐒‌єᴄσηᴅѕ.\n⇢ 𝐌‌σʀє : 𝐎‌ᴘєη Ꭲʜє 𝐀‌ᴅᴠαηᴄєᴅ 𝐒‌єᴛᴛɪηɢѕ 𝐌‌єηυ.\n\n𝐒‌єᴛᴛɪηɢѕ & 𝐏‌ℓαʏ 𝐌‌σᴅєѕ :\n\n⇢ ⊘ : 𝐌‌υᴛє Ꭲʜє 𝐀‌ѕѕɪѕᴛαηᴛ 𝐈‌η 𝐕‌ɪᴅєσ 𝐂‌ʜαᴛ.\n⇢ ♷ : 𝐄‌ηαʙℓє 𝐎‌ʀ 𝐃‌ɪѕαʙℓє 𝐋‌σσᴘ 𝐌‌σᴅє.\n⇢ ᴀ‣I : 𝐓‌σɢɢℓє 𝐀‌υᴛσ-𝐒‌κɪᴘ 𝐎‌ʀ 𝐓‌ʀαᴄκ 𝐌‌σᴅє.\n⇢ ⏣ : 𝐔‌ηᴍυᴛє Ꭲʜє 𝐀‌ѕѕɪѕᴛαηᴛ 𝐈‌η 𝐕‌ɪᴅєσ 𝐂‌ʜαᴛ.\n⇢ ♫ 𝐀‌υᴛσᴘℓαʏ : 𝐓‌σɢɢℓє 𝐀‌υᴛσᴍαᴛɪᴄ 𝐏‌ℓαʏʙαᴄκ 𝐎‌ғ 𝐑‌єℓαᴛєᴅ 𝐒‌σηɢѕ.\n⇢ ⎘ 𝐓‌ʜυᴍʙηαɪℓ : 𝐓‌σɢɢℓє 𝐓‌ʜυᴍʙηαɪℓ 𝐃‌ɪѕᴘℓαʏ 𝐎‌η/𝐎‌ғғ.\n\n❏ 𝐍‌σᴛє : 𝐀‌ℓℓ 𝐁‌υᴛᴛσηѕ 𝐀‌ʀє 𝐎‌ηℓʏ 𝐀‌ᴠαɪℓαʙℓє 𝐅‌σʀ 𝐆‌ʀσυᴘ 𝐀‌ᴅᴍɪηѕ.</b></blockquote>"
